name: contract

# Tests the proof-of-analysis contract and builds its wasm. No Rust is needed on any laptop:
# this is where the contract is compiled. The wasm size is reported because the storage balance
# locked on chain is size x 0.00001 NEAR.
on:
  push:
    paths:
      - "contracts/proof-of-analysis/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

permissions:
  contents: write # only to commit a newly generated Cargo.lock on feature branches

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/proof-of-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-near 0.22.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          rustc --version
          cargo --version
          cargo near --version

      - name: Unit tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Show the test output as an annotation
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()[-80:]
          msg = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=cargo test, last 80 lines::{msg}")
          PY

      - name: Commit Cargo.lock when it is new (feature branches only)
        if: always() && github.ref_name != 'main'
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain contracts/proof-of-analysis/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/proof-of-analysis/Cargo.lock
            git commit -m "contract: add Cargo.lock generated by CI"
            git push
          fi

      - name: Build the wasm
        run: |
          set -o pipefail
          cargo near build non-reproducible-wasm 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the build output as an annotation
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()[-40:]
          msg = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=cargo near build, last 40 lines::{msg}")
          PY

      - name: Report the wasm size, hash and the NEAR it locks
        run: |
          wasm=$(find target/near -name '*.wasm' | head -1)
          size=$(stat -c %s "$wasm")
          sha=$(sha256sum "$wasm" | cut -d' ' -f1)
          locked=$(python3 -c "print(f'{$size * 10**19 / 10**24:.4f}')")
          echo "wasm=$wasm size_bytes=$size sha256=$sha storage_locked_near=$locked"
          {
            echo "### proof-of-analysis wasm"
            echo "- file: \`$(basename "$wasm")\`"
            echo "- size: $size bytes"
            echo "- sha256: \`$sha\`"
            echo "- storage balance locked for the code: $locked NEAR (size x 1e19 yoctoNEAR)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=wasm::file=$(basename "$wasm") size_bytes=$size sha256=$sha storage_locked_near=$locked"

      - uses: actions/upload-artifact@v4
        with:
          name: proof-of-analysis-wasm
          path: |
            contracts/proof-of-analysis/target/near/*.wasm
            contracts/proof-of-analysis/target/near/*.json
          if-no-files-found: error
