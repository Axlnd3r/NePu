[project]
name = "near-capture-ledger"
version = "0.1.0"
description = "Reproducible investment-thesis tool: can NEAR Intents value capture outgrow token issuance?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "google-cloud-bigquery",
    "httpx",
    "python-dotenv",
    "numpy",
    "scipy",
    "typer",
]

[project.scripts]
capture = "capture.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The thesis text is built from nested f-strings that read worse when split.
[tool.ruff.lint.per-file-ignores]
"src/capture/thesis.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
